[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "own-your-voice-asr-labs"
version = "0.1.0"
description = "Single-GPU Parakeet ASR labs for NVIDIA Brev"
requires-python = ">=3.10,<3.15"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
