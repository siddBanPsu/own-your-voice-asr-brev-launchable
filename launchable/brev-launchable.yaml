# Documentation manifest for the Brev Console Launchable builder.
# Brev Launchables are created in the Console; this file records the exact settings.
schema_version: 1
name: Own Your Voice - Parakeet ASR Labs
description: >-
  Three single-GPU labs for Parakeet ASR: deploy the supported 0.6B Speech NIM,
  run a configurable English-to-Dutch FLEURS adaptation with held-out selection,
  then export to ONNX and serve with NVIDIA Triton Inference Server.

default_hardware:
  provider: aws
  instance_type: g6.2xlarge
  gpu: 1x NVIDIA L4
  gpu_memory_gb_reported_by_brev: 22
  host_memory_gb: 32
  disk_gb: 150
  reason: Matches the AWS G6/L4 workshop target and supports every lab.

validated_profiles:
  - label: Minimum
    gpu: NVIDIA T4 16 GB
    host_memory_gb: 32
    lab_profile: t4
    notes: Labs 2-3 only. Lab 2 uses a smaller Dutch subset and CTC-head adaptation.
  - label: Standard
    gpu: NVIDIA L4 22/24 GB or A10 24 GB
    host_memory_gb: 32
    lab_profile: l4
    notes: Lab 2 trains the CTC head and last two encoder blocks with best-checkpoint selection.
  - label: Full
    gpu: NVIDIA A100 40/80 GB
    host_memory_gb: 32
    lab_profile: a100
    notes: Lab 2 defaults to the conservative two-block path; controls can be changed deliberately.

software:
  mode: VM
  managed_jupyter: true
  python_version: "3.12"
  python_manager: uv
  setup_script_file: launchable/setup.sh
  jupyter_root_candidates:
    - ~/workspace/own-your-voice-asr-brev-launchable
    - ~/own-your-voice-asr-brev-launchable
  jupyter_default_url: /lab/tree/labs/00_start_here.ipynb?reset

speech_nim:
  container_id: parakeet-0-6b-ctc-en-us
  image: nvcr.io/nim/nvidia/parakeet-0-6b-ctc-en-us:latest
  tags_selector: name=parakeet-0-6b-ctc-en-us,bs=1,mode=ofl,diarizer=disabled,vad=default
  http_port: 9000
  grpc_port: 50051
  access: NVIDIA AI Enterprise license and personal NGC API key with Catalog access
  credential_handling: Prompt in Lab 1 at runtime; never store in Launchable or repository.

source:
  type: public_git_repository
  repository_url: https://github.com/siddBanPsu/own-your-voice-asr-brev-launchable

network:
  secure_links:
    - name: jupyter
      port: 8888
      show_as_call_to_action: true
  public_tcp_udp_ports: []

launch_parameters:
  - name: LAB_PROFILE
    required: false
    default: auto
    allowed_values: [auto, t4, l4, a100]
    description: Override automatic VRAM-based lab sizing only for troubleshooting.

view_access: anyone_with_link
